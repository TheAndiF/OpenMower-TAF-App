name: TAF Release Build App

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version, e.g. XX2026-06-01-test1 or MA2026-06-01"
        required: true
        type: string
      source_ref:
        description: "Git ref to build, e.g. main, tag or commit SHA"
        required: true
        default: "main"
        type: string
      android_build_mode:
        description: "Android build mode"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read
  packages: write

env:
  FLUTTER_CHANNEL: stable

jobs:
  build_web_app_image:
    name: Build and push Web App Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Show build info
        run: |
          echo "Release version: ${{ inputs.release_version }}"
          echo "Source ref:      ${{ inputs.source_ref }}"
          echo "Web App image latest:    ghcr.io/theandif/openmower-taf-app-web:taf_latest"
          echo "Web App image versioned: ghcr.io/theandif/openmower-taf-app-web:${{ inputs.release_version }}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Web App Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/theandif/openmower-taf-app-web:taf_latest
            ghcr.io/theandif/openmower-taf-app-web:${{ inputs.release_version }}

  build_android_artifacts:
    name: Build Android APK/AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Show Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Restore Android upload keystore
        if: ${{ inputs.android_build_mode == 'release' }}
        shell: bash
        run: |
          mkdir -p android/keystore
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/keystore/upload-keystore.jks

      - name: Create Android key.properties
        if: ${{ inputs.android_build_mode == 'release' }}
        shell: bash
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=keystore/upload-keystore.jks
          EOF

      - name: Build Android APK
        run: flutter build apk --${{ inputs.android_build_mode }}

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenMower-TAF-App-${{ inputs.release_version }}-${{ inputs.android_build_mode }}-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Build Android AAB
        if: ${{ inputs.android_build_mode == 'release' }}
        run: flutter build appbundle --release

      - name: Upload Android AAB artifact
        if: ${{ inputs.android_build_mode == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: OpenMower-TAF-App-${{ inputs.release_version }}-release-aab
          path: build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
