name: TAF Release Build App

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version, e.g. MA2026-06-01 or XX2026-06-01-test3"
        required: true
        type: string
      source_ref:
        description: "Git ref to build from"
        required: true
        default: "main"
        type: string

permissions:
  contents: read
  packages: write
  actions: read

jobs:
  build_web_container:
    name: Build Web GUI container
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected App ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Show release context
        run: |
          echo "Release version: ${{ inputs.release_version }}"
          echo "Source ref:      ${{ inputs.source_ref }}"
          echo "Repository:      ${{ github.repository }}"
          git rev-parse HEAD

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push App web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/theandif/openmower-taf-app-web:${{ inputs.release_version }}
            ghcr.io/theandif/openmower-taf-app-web:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build_android_apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected App ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenMower-TAF-App-${{ inputs.release_version }}.apk
          path: build/app/outputs/flutter-apk/app-release.apk
