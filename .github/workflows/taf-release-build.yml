name: TAF Release Build App

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version, e.g. XX2026-06-01-test1 or MA2026-06-01"
        required: true
        type: string
      source_ref:
        description: "Git ref to build, e.g. main, tag or commit SHA"
        required: true
        default: "main"
        type: string
      android_build_mode:
        description: "Android build mode"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read
  packages: write

env:
  FLUTTER_CHANNEL: stable

jobs:
  build_web_app_image:
    name: Build and push Web App Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Show Web App build info
        run: |
          echo "Release version: ${{ inputs.release_version }}"
          echo "Source ref:      ${{ inputs.source_ref }}"
          echo "Web App image latest:    ghcr.io/theandif/openmower-taf-app-web:taf_latest"
          echo "Web App image versioned: ghcr.io/theandif/openmower-taf-app-web:${{ inputs.release_version }}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Web App is published as a container image.
      # taf_latest is the rolling robot/update tag.
      # release_version is the immutable tag for reproducible deployments.
      - name: Build and push Web App Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/theandif/openmower-taf-app-web:taf_latest
            ghcr.io/theandif/openmower-taf-app-web:${{ inputs.release_version }}

  build_apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Show Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      # APK is kept as a GitHub Actions artifact.
      # AAB/store signing can be added later as a separate job.
      - name: Build APK
        run: flutter build apk --${{ inputs.android_build_mode }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenMower-TAF-App-${{ inputs.release_version }}-apk-${{ inputs.android_build_mode }}
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
