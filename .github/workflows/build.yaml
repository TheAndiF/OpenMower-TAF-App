name: Build Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      arch:
        description: Target architecture (amd64, arm64, both)
        required: true
        default: both
        type: choice
        options:
          - amd64
          - arm64
          - both
      use_cache:
        description: Use build cache (true/false)
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      renderer:
        description: Flutter web renderer (html|canvaskit)
        required: true
        default: html
        type: choice
        options:
          - html
          - canvaskit

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  meta:
    # Build nur bei manuellem Start oder Commit-Nachricht mit BS_ / BL_.
    # BS_ = schneller Build mit Cache, BL_ = kompletter Build ohne Cache.
    if: |
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.head_commit.message, 'BS_') ||
      startsWith(github.event.head_commit.message, 'BL_')
    runs-on: ubuntu-latest
    outputs:
      base_tags: ${{ steps.compute.outputs.base_tags }}
      renderer: ${{ steps.compute.outputs.renderer }}
      use_cache: ${{ steps.compute.outputs.use_cache }}
      build_both: ${{ steps.compute.outputs.build_both }}
      build_amd64: ${{ steps.compute.outputs.build_amd64 }}
      build_arm64: ${{ steps.compute.outputs.build_arm64 }}
    steps:
